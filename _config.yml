# Pack 3472 Cub Scout Website
# Jekyll Configuration

# Site settings
title: Pack 3472
email: info@pack3472.org
description: >-
  Pack 3472 Cub Scouts - Fun, adventure, and learning for elementary-aged children
  in Springfield, IL. Join us for camping, service projects, and outdoor activities!
baseurl: ""
url: "https://pack3472.org"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  events:
    output: true
    permalink: /events/:title/
  announcements:
    output: true
    permalink: /announcements/:year/:month/:title/
  galleries:
    output: true
    permalink: /gallery/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "announcements"
    values:
      layout: "announcement"
  - scope:
      path: ""
      type: "galleries"
    values:
      layout: "gallery"

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs/
  - specs/
  - .specify/
  - .github/
  - README.md
  - LICENSE

# Timezone
timezone: America/Chicago

# Permalink style
permalink: pretty

# Sass/SCSS configuration
sass:
  sass_dir: assets/css
  style: compressed
