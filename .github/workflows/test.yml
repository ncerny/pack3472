name: Test Site Quality

on:
  push:
    branches: ["main", "001-website-redesign"]
  pull_request:
    branches: ["main"]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    name: Accessibility Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          
      - name: Build site
        run: bundle exec jekyll build
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install pa11y-ci
        run: npm install -g pa11y-ci
        
      - name: Serve site
        run: bundle exec jekyll serve --detach
        
      - name: Run accessibility tests
        run: pa11y-ci --sitemap http://localhost:4000/sitemap.xml || echo "Accessibility issues found"

  link-check:
    runs-on: ubuntu-latest
    name: Link Checker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          
      - name: Build site
        run: bundle exec jekyll build
        
      - name: Check internal links
        uses: peter-evans/link-checker@v1
        with:
          args: -r -d ./_site/ ./_site/

  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          
      - name: Build site
        run: bundle exec jekyll build
        
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:4000/
            http://localhost:4000/about/
            http://localhost:4000/calendar/
          uploadArtifacts: true
