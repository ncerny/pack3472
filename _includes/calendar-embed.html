<!-- 
  SETUP INSTRUCTIONS:
  
  1. Go to Google Calendar (calendar.google.com)
  2. Find or create the Pack 3472 calendar
  3. Click the three dots next to the calendar name → Settings and sharing
  4. Scroll to "Integrate calendar"
  5. Copy the Calendar ID (looks like: abc123@group.calendar.google.com)
  6. Replace YOUR_CALENDAR_ID above with your actual calendar ID
  
  Customization options in the URL:
  - ctz=America%2FChicago → Change timezone
  - mode=AGENDA → Show agenda view (can also be WEEK or MONTH)
  - color=%23003F87 → Calendar color (BSA blue)
  - height=600 → Calendar height in pixels
  
  See docs/ADMIN-GUIDE.md for detailed instructions with screenshots.
-->
