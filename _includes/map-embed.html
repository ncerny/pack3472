<!-- Google Maps Embed -->
<div class="map-embed">
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.682586098994!2d{{ site.data.pack-info.meeting_info.location.longitude }}!3d{{ site.data.pack-info.meeting_info.location.latitude }}!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zM!5e0!3m2!1sen!2sus!4v1234567890"
    width="100%"
    height="450"
    style="border: 0"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    title="Pack 3472 Meeting Location Map"
    aria-label="Map showing Pack 3472 meeting location at {{ site.data.pack-info.meeting_info.location.name }}"
  ></iframe>
  <p class="map-link">
    <a
      href="{{ site.data.pack-info.meeting_info.location.google_maps_url }}"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-outline"
    >
      Open in Google Maps
    </a>
  </p>
</div>

<!-- 
  TO CONFIGURE THIS MAP:
  1. Go to Google Maps
  2. Search for your meeting location
  3. Click "Share" → "Embed a map"
  4. Copy the iframe src URL
  5. Replace the src attribute above with your URL
  
  Alternatively, get coordinates:
  1. Right-click on location in Google Maps
  2. Note the latitude/longitude
  3. Update pack-info.yml with coordinates
  4. Update the src URL parameters above
  
  See docs/ADMIN-GUIDE.md for detailed instructions.
-->
